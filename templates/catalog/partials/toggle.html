<span id="toggle-{{ p.pk }}">{% if can_edit %}<form method="post" action="{% url 'catalog:toggle' p.pk %}" hx-post="{% url 'catalog:toggle' p.pk %}" hx-target="#toggle-{{ p.pk }}" hx-swap="outerHTML">{% csrf_token %}<button type="submit" class="badge-btn {% if p.is_active %}on{% endif %}" aria-pressed="{{ p.is_active|yesno:'true,false' }}">{{ p.is_active|yesno:"Sichtbar,Ausgeblendet" }}</button></form>{% else %}<span class="badge {{ p.is_active|yesno:'ok,' }}">{{ p.is_active|yesno:"Sichtbar,Ausgeblendet" }}</span>{% endif %}</span>
